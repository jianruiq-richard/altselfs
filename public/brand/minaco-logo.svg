    <rect x="9.75" y="9.75" width="76.5" height="76.5" rx="17.25" stroke="url(#logo-edge)" stroke-opacity="0.88" stroke-width="1.5"/>
    <path d="M26 69V31L48 53L70 31V69" stroke="url(#logo-white)" stroke-width="8" stroke-linejoin="miter" stroke-linecap="square"/>
    <path d="M34 23L48 40" stroke="url(#logo-signal-left)" stroke-width="4.5" stroke-linecap="round"/>
