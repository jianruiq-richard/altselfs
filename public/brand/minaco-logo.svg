<svg width="306" height="96" viewBox="0 0 306 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Minaco logo</title>
  <desc id="desc">Minaco wordmark paired with a geometric M-shaped decision mark.</desc>
  <defs>
    <linearGradient id="logo-edge" x1="14" y1="12" x2="82" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7BA7FF"/>
      <stop offset="0.48" stop-color="#58D68D"/>
      <stop offset="0.74" stop-color="#FFC857"/>
      <stop offset="1" stop-color="#FF735F"/>
    </linearGradient>
    <linearGradient id="logo-white" x1="24" y1="26" x2="72" y2="73" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.52" stop-color="#D8DDE6"/>
