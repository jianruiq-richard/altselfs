<svg width="520" height="420" viewBox="0 0 520 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Minaco stacked logo for dark backgrounds</title>
  <desc id="desc">Minaco stacked lockup with two warm starlights above the wordmark.</desc>
  <defs>
    <path id="star" d="M0 -58C6 -25 18 -9 50 0C18 9 6 25 0 58C-6 25 -18 9 -50 0C-18 -9 -6 -25 0 -58Z"/>
    <radialGradient id="main-fill" cx="42%" cy="42%" r="72%">
      <stop offset="0" stop-color="#FFF7EA"/>
      <stop offset="0.34" stop-color="#FFD778"/>
      <stop offset="0.72" stop-color="#F4B64A"/>
      <stop offset="1" stop-color="#D08A4F"/>
    </radialGradient>
    <radialGradient id="small-fill" cx="42%" cy="42%" r="72%">
      <stop offset="0" stop-color="#FFF0D7"/>
      <stop offset="0.48" stop-color="#E86F61"/>
      <stop offset="1" stop-color="#BF5947"/>
    </radialGradient>
    <linearGradient id="word" x1="76" y1="272" x2="442" y2="344" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7EA"/>
      <stop offset="0.62" stop-color="#EADDC9"/>
      <stop offset="1" stop-color="#FFF7EA"/>
    </linearGradient>
    <filter id="main-glow" x="80" y="-4" width="304" height="304" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="small-glow" x="256" y="12" width="152" height="152" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <use href="#star" transform="translate(225 136) scale(1.55)" fill="url(#main-fill)"/>
  <use href="#star" transform="translate(337 74) scale(0.702)" fill="url(#small-fill)"/>
  <text x="65" y="338" fill="url(#word)" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="400" letter-spacing="-2">Minaco</text>
</svg>
