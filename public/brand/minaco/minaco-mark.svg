<svg width="320" height="240" viewBox="0 0 320 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Minaco mark</title>
  <desc id="desc">Two warm starlights representing a founder's judgment and a gentle co-thinking presence.</desc>
  <defs>
    <path id="star" d="M0 -58C6 -25 18 -9 50 0C18 9 6 25 0 58C-6 25 -18 9 -50 0C-18 -9 -6 -25 0 -58Z"/>
    <radialGradient id="main-fill" cx="42%" cy="42%" r="72%">
      <stop offset="0" stop-color="#FFF7EA"/>
      <stop offset="0.34" stop-color="#FFD778"/>
      <stop offset="0.72" stop-color="#F4B64A"/>
      <stop offset="1" stop-color="#D08A4F"/>
    </radialGradient>
    <radialGradient id="small-fill" cx="42%" cy="42%" r="72%">
      <stop offset="0" stop-color="#FFF0D7"/>
      <stop offset="0.48" stop-color="#E86F61"/>
      <stop offset="1" stop-color="#BF5947"/>
    </radialGradient>
    <filter id="main-glow" x="38" y="18" width="188" height="188" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="small-glow" x="164" y="20" width="102" height="102" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <use href="#star" transform="translate(138 126)" fill="#F4B64A" opacity="0.34" filter="url(#main-glow)"/>
  <use href="#star" transform="translate(210 86) scale(0.453)" fill="#E86F61" opacity="0.3" filter="url(#small-glow)"/>
  <use href="#star" transform="translate(138 126)" fill="url(#main-fill)"/>
  <use href="#star" transform="translate(210 86) scale(0.453)" fill="url(#small-fill)"/>
</svg>
