<svg width="720" height="180" viewBox="0 0 720 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Minaco horizontal logo for light backgrounds</title>
  <desc id="desc">Minaco horizontal lockup with two warm starlights and soft ink wordmark.</desc>
  <defs>
    <path id="star" d="M0 -58C6 -25 18 -9 50 0C18 9 6 25 0 58C-6 25 -18 9 -50 0C-18 -9 -6 -25 0 -58Z"/>
    <radialGradient id="main-fill" cx="42%" cy="42%" r="72%">
      <stop offset="0" stop-color="#FFF7EA"/>
      <stop offset="0.34" stop-color="#FFD778"/>
      <stop offset="0.72" stop-color="#F4B64A"/>
      <stop offset="1" stop-color="#D08A4F"/>
    </radialGradient>
    <radialGradient id="small-fill" cx="42%" cy="42%" r="72%">
      <stop offset="0" stop-color="#FFF0D7"/>
      <stop offset="0.48" stop-color="#E86F61"/>
      <stop offset="1" stop-color="#BF5947"/>
    </radialGradient>
    <filter id="main-glow" x="0" y="18" width="156" height="156" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="small-glow" x="96" y="16" width="90" height="90" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <use href="#star" transform="translate(78 84) scale(0.86)" fill="url(#main-fill)"/>
  <use href="#star" transform="translate(140 50) scale(0.39)" fill="url(#small-fill)"/>
  <text x="190" y="118" fill="#100E0C" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="400" letter-spacing="-2">Minaco</text>
</svg>
