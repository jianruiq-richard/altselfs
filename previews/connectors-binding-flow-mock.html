<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connectors Binding Flow Mock | Astromar</title>
  <style>
    :root{color-scheme:dark;--bg:#090a0a;--sidebar:#0c0d0e;--line:rgba(255,255,255,.09);--line-strong:rgba(255,255,255,.16);--text:#f4f4f2;--muted:rgba(255,255,255,.61);--subtle:rgba(255,255,255,.37);--green:#46d19a;--blue:#8eb3ff;--yellow:#e9b85a;--red:#ff8a82}
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}button,input{font:inherit}button{cursor:pointer}[hidden]{display:none!important}
    .scroll{scrollbar-color:rgba(255,255,255,.16) transparent;scrollbar-width:thin}.scroll::-webkit-scrollbar{width:6px;height:6px}.scroll::-webkit-scrollbar-track{background:transparent}.scroll::-webkit-scrollbar-thumb{border-radius:999px;background:rgba(255,255,255,.14)}
    .app{display:grid;grid-template-columns:244px minmax(0,1fr);height:100vh;height:100dvh;overflow:hidden}.sidebar{display:flex;min-width:0;flex-direction:column;overflow:hidden;border-right:1px solid var(--line);background:var(--sidebar)}.side-head{display:flex;height:64px;align-items:center;justify-content:space-between;padding:0 16px}.brand{display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:750}.brand-mark{display:grid;width:32px;height:32px;place-items:center;border:1px solid var(--line-strong);border-radius:7px;background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.025))}.brand-mark:after{width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 16px rgba(255,255,255,.62);content:""}
    .icon-btn{display:grid;width:34px;height:34px;padding:0;place-items:center;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--subtle)}.icon-btn:hover{border-color:var(--line);background:rgba(255,255,255,.05);color:#fff}.new-chat{display:flex;min-height:44px;align-items:center;justify-content:center;gap:8px;margin:0 12px 12px;border:1px solid rgba(255,255,255,.8);border-radius:7px;background:#f2f2f0;color:#0b0b0b;font-size:13px;font-weight:750}
    .primary-nav{display:grid;gap:2px;padding:0 10px 13px;border-bottom:1px solid var(--line)}.nav-item{display:flex;min-height:38px;align-items:center;gap:10px;padding:0 11px;border:0;border-radius:7px;background:transparent;color:var(--muted);font-size:13px;text-align:left}.nav-item.active,.nav-item:hover{background:rgba(255,255,255,.085);color:#fff}.nav-icon{width:18px;text-align:center;color:var(--subtle)}.side-spacer{flex:1}.side-foot{padding:12px;border-top:1px solid var(--line)}.profile-card{display:grid;width:100%;min-height:58px;grid-template-columns:38px minmax(0,1fr) 18px;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:7px;background:rgba(255,255,255,.025);color:#fff;text-align:left}.avatar{display:grid;width:38px;height:38px;place-items:center;border-radius:7px;background:#d9dce1;color:#161616;font-size:11px;font-weight:850}.profile-copy{display:grid;min-width:0}.profile-copy strong,.profile-copy span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.profile-copy strong{font-size:12px}.profile-copy span{color:var(--subtle);font-size:10px}
    .main{display:grid;min-width:0;grid-template-rows:64px minmax(0,1fr);overflow:hidden}.topbar{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:0 24px}.top-title{display:grid}.top-title strong{font-size:13px}.top-title span{margin-top:2px;color:var(--subtle);font-size:10px}.quiet-button,.primary-button,.danger-button{display:inline-flex;min-height:34px;align-items:center;justify-content:center;gap:7px;padding:0 11px;border-radius:7px;font-size:11px;font-weight:700;transition:.16s ease}.quiet-button{border:1px solid var(--line);background:rgba(255,255,255,.025);color:var(--muted)}.quiet-button:hover{border-color:var(--line-strong);background:rgba(255,255,255,.055);color:#fff}.primary-button{border:1px solid #fff;background:#f3f3f1;color:#101010}.danger-button{border:1px solid rgba(255,138,130,.22);background:rgba(255,138,130,.055);color:var(--red)}
    .workspace-scroll{min-width:0;overflow-y:auto;padding:24px 16px 70px}.workspace-inner{width:min(100%,1180px);margin:0 auto}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin:0 0 24px}.page-head h1{margin:0;font-size:28px;line-height:1.1}.page-head p{margin:8px 0 0;color:var(--muted);font-size:12px}.connected-pill{display:inline-flex;min-height:30px;align-items:center;gap:8px;border:1px solid rgba(70,209,154,.2);border-radius:999px;background:rgba(70,209,154,.06);padding:0 12px;color:var(--green);font-size:10px;font-weight:850}.connected-pill i{width:6px;height:6px;border-radius:50%;background:var(--green)}
    .search{position:relative;display:block;margin-bottom:12px}.search span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--subtle);font-size:16px}.search input{width:100%;height:46px;padding:0 14px 0 40px;border:1px solid var(--line);border-radius:8px;outline:0;background:rgba(255,255,255,.035);color:#fff;font-size:13px}.tabs{display:flex;gap:1px;overflow-x:auto;margin:0 0 20px}.tab{height:34px;flex:0 0 auto;border:1px solid transparent;border-radius:7px;background:transparent;padding:0 12px;color:var(--muted);font-size:11px;font-weight:750}.tab.active,.tab:hover{border-color:var(--line);background:rgba(255,255,255,.075);color:#fff}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{display:grid;min-height:104px;grid-template-columns:48px minmax(0,1fr) 38px;align-items:center;gap:14px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.022);padding:16px;text-align:left;color:inherit;transition:.16s ease}.card:hover{border-color:rgba(255,255,255,.15);background:rgba(255,255,255,.04)}.card.connected{background:linear-gradient(135deg,rgba(70,209,154,.035),rgba(255,255,255,.02))}.logo{display:grid;width:48px;height:48px;place-items:center;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.045);font-size:13px;font-weight:850}.gmail .logo{color:#ff7d73}.feishu .logo{color:#8eb3ff}.meta .logo{color:#f38eea}.wechat .logo{color:#46d19a}.similarweb .logo{color:#8eb3ff}.semrush .logo{color:#e9b85a}.domain .logo{color:#46d19a}.xiaohongshu .logo{color:#ff7464}.copy{display:grid;min-width:0}.copy strong{font-size:15px}.copy span{display:block;margin-top:4px;color:var(--muted);font-size:12px;line-height:1.45}.copy small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:6px;color:var(--subtle);font-size:10px}.action{display:grid;width:38px;height:38px;place-items:center;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.025);color:var(--muted);font-size:18px}.connected .action{border-color:rgba(70,209,154,.2);background:rgba(70,209,154,.075);color:var(--green)}
    .scrim{position:fixed;z-index:70;inset:0;display:none;background:rgba(0,0,0,.66);backdrop-filter:blur(5px)}.scrim.show{display:block}.drawer{position:fixed;z-index:80;inset:0 0 0 auto;display:grid;width:min(100%,460px);grid-template-rows:auto minmax(0,1fr) auto;border-left:1px solid var(--line-strong);background:linear-gradient(180deg,#17181a,#101113);box-shadow:-28px 0 90px rgba(0,0,0,.5);transform:translateX(105%);transition:transform .2s ease}.drawer.show{transform:translateX(0)}.drawer-head{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:12px;align-items:start;border-bottom:1px solid var(--line);padding:18px}.drawer-head h2{margin:0;font-size:18px}.drawer-head p{margin:5px 0 0;color:var(--subtle);font-size:11px;line-height:1.55}.drawer-body{min-height:0;overflow-y:auto;padding:18px}.drawer-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:14px 18px;background:rgba(10,11,12,.5)}
    .block{border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.024);padding:13px;margin-bottom:10px}.block h3{margin:0 0 6px;font-size:12px}.block p{margin:0;color:var(--subtle);font-size:11px;line-height:1.58}.note{border-color:rgba(142,179,255,.18);background:rgba(142,179,255,.075)}.permission{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.022);padding:10px;margin-top:8px}.permission strong{font-size:11px}.permission span{color:var(--subtle);font-size:10px;line-height:1.45}.package-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.package{border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.024);padding:10px;color:var(--muted);font-size:10px;text-align:left}.package.active{border-color:rgba(70,209,154,.25);background:rgba(70,209,154,.08);color:#fff}.package strong{display:block;font-size:11px;color:inherit}.package span{display:block;margin-top:2px;color:var(--subtle)}
    .waiting{display:grid;min-height:180px;place-items:center;border:1px solid var(--line);border-radius:12px;background:radial-gradient(circle at 50% 0,rgba(70,209,154,.13),transparent 44%),rgba(255,255,255,.024);padding:20px;text-align:center}.waiting strong{display:block;font-size:17px}.waiting p{max-width:330px;margin:8px auto 0;color:var(--subtle);font-size:11px;line-height:1.6}.spinner{width:26px;height:26px;margin:0 auto 13px;border:2px solid rgba(255,255,255,.12);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.success{border:1px solid rgba(70,209,154,.24);border-radius:12px;background:rgba(70,209,154,.08);padding:13px;color:#dbf9eb}.success strong{font-size:13px}.success span{display:block;margin-top:4px;color:rgba(219,249,235,.72);font-size:11px;line-height:1.55}.danger{border-color:rgba(255,138,130,.22);background:rgba(255,138,130,.055)}.danger h3{color:#ffd0cc}.inline-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
    .account-list{display:grid;gap:8px;margin-top:10px}.account-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.022);padding:10px}.account-row strong,.account-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.account-row strong{display:block;font-size:11px}.account-row span{display:block;margin-top:2px;color:var(--subtle);font-size:10px}.mini-actions{display:flex;gap:6px}.mini-actions button{min-height:28px;padding:0 8px;font-size:10px}.default-tag{display:inline-flex;min-height:20px;align-items:center;border:1px solid rgba(70,209,154,.22);border-radius:999px;background:rgba(70,209,154,.08);padding:0 7px;color:var(--green);font-size:9px;font-weight:800}
    .auth-steps{display:grid;gap:8px}.auth-step{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:9px;align-items:center;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.022);padding:10px}.auth-step.done{border-color:rgba(70,209,154,.22);background:rgba(70,209,154,.06)}.auth-step.current{border-color:rgba(142,179,255,.24);background:rgba(142,179,255,.07)}.auth-step i{display:grid;width:24px;height:24px;place-items:center;border-radius:7px;background:rgba(255,255,255,.06);color:var(--subtle);font-style:normal;font-size:10px;font-weight:850}.auth-step.done i{color:var(--green)}.auth-step.current i{color:#cfe0ff}.auth-step strong{display:block;font-size:11px}.auth-step span{display:block;margin-top:2px;color:var(--subtle);font-size:10px;line-height:1.45}.auth-step button{min-height:28px;padding:0 8px;font-size:10px}
    .toast{position:fixed;z-index:100;right:22px;bottom:22px;display:flex;align-items:center;gap:9px;max-width:360px;padding:11px 13px;border:1px solid var(--line-strong);border-radius:8px;background:#18191b;color:#fff;box-shadow:0 20px 70px rgba(0,0,0,.52);font-size:11px;opacity:0;pointer-events:none;transform:translateY(8px);transition:.18s}.toast.show{opacity:1;transform:translateY(0)}.toast i{width:7px;height:7px;border-radius:50%;background:var(--green)}
    @media(max-width:900px){.app{grid-template-columns:minmax(0,1fr)}.sidebar{display:none}.grid{grid-template-columns:minmax(0,1fr)}.workspace-scroll{padding-inline:14px}.page-head{display:block}.connected-pill{margin-top:12px}.drawer{width:100%;border-left:0}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="side-head"><a class="brand"><span class="brand-mark"></span><span>Astromar</span></a><button class="icon-btn">⌘</button></div>
      <button class="new-chat">✎ New discussion</button>
      <nav class="primary-nav"><button class="nav-item"><span class="nav-icon">⌂</span>Home</button><button class="nav-item"><span class="nav-icon">◱</span>Discussion</button><button class="nav-item active"><span class="nav-icon">⌁</span>Connectors</button><button class="nav-item"><span class="nav-icon">⚙</span>Settings</button></nav>
      <div class="side-spacer"></div>
      <div class="side-foot"><button class="profile-card"><span class="avatar">JR</span><span class="profile-copy"><strong>Jian Ruiqing</strong><span>jianruiq@gmail.com</span></span><span>›</span></button></div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="top-title"><strong>Connectors</strong><span>Workspace connections</span></div><button class="quiet-button" id="refresh">↻</button></header>
      <section class="workspace-scroll scroll">
        <div class="workspace-inner">
          <div class="page-head"><div><h1>Connectors</h1><p>Connect once, then choose the context available to each discussion.</p></div><span class="connected-pill"><i></i><span id="connectedCount">0</span> connected</span></div>
          <label class="search"><span>⌕</span><input id="search" type="search" placeholder="Search connectors" /></label>
          <nav class="tabs" id="tabs"><button class="tab active" data-category="all">All</button><button class="tab" data-category="communication">Communication</button><button class="tab" data-category="social">Social</button><button class="tab" data-category="intelligence">Intelligence</button></nav>
          <div class="grid" id="grid"></div>
        </div>
      </section>
    </main>
  </div>
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-live="polite" aria-label="Connector binding flow">
    <header class="drawer-head"><div><h2 id="drawerTitle">Connect</h2><p id="drawerSubtitle"></p></div><button class="icon-btn" id="close">×</button></header>
    <div class="drawer-body scroll" id="drawerBody"></div>
    <footer class="drawer-foot"><button class="quiet-button" id="secondary">Cancel</button><button class="primary-button" id="primary">Continue</button></footer>
  </aside>
  <div class="toast" id="toast"><i></i><span id="toastText"></span></div>
  <script>
    const connectors=[
      {key:'gmail',family:'gmail',category:'communication',initials:'G',label:'Gmail',description:'Email, inbox context, threads, and send actions.',connected:true,account:'2 accounts',accounts:['jiawei.yan1@gmail.com','ops@astromar.ai'],defaultAccount:'jiawei.yan1@gmail.com',oauth:true,multiAccount:true,permissions:[['Search inbox','Find relevant emails when a task needs them.'],['Read selected threads','Summarize thread contents and attachments.'],['Draft replies','Draft only; send requires confirmation.']]},
      {key:'feishu',family:'feishu',category:'communication',initials:'L',label:'Lark',description:'Messages, contacts, calendar, docs, and meetings.',connected:false,account:'Not connected',accounts:[],defaultAccount:'',oauth:true,featurePackages:true,multiStepAuth:true,permissions:[['Messages','Read selected direct messages and group chats.'],['Docs','Search and read workspace documents.'],['Calendar','Read events and meeting context.'],['Contacts','Find people and organization details.']]},
      {key:'meta',family:'meta',category:'social',initials:'M',label:'Instagram / Facebook',description:'Meta accounts, Instagram business assets, and Facebook Pages.',connected:true,account:'3 assets',accounts:['Astromar Labs Page','@astromar_ai','Founder Studio Page'],defaultAccount:'@astromar_ai',oauth:true,multiAccount:true,permissions:[['Account discovery','List Pages and Instagram business accounts.'],['Read selected assets','Use selected assets only.'],['Insights','Read audience and media metrics.']]},
      {key:'wechat',family:'wechat',category:'communication',initials:'W',label:'WeChat',description:'Manage selected Official Account sources and their latest updates.',connected:true,account:'36Kr, 晚点 LatePost',manual:true,permissions:[['Source selection','Add or remove public Official Accounts.'],['Read public articles','Use indexed public articles.']]},
      {key:'xiaohongshu',family:'xiaohongshu',category:'social',initials:'X',label:'Xiaohongshu',description:'Manage Xiaohongshu collection workflow and content signals.',connected:false,account:'Not connected',manual:true,permissions:[['Workflow settings','Configure collection scope.'],['Read collected records','Use collected posts and creator signals.']]},
      {key:'similarweb_api1',family:'similarweb',category:'intelligence',initials:'SW',label:'Similarweb API1',description:'Traffic, ranking, audience, referrals, and engagement metrics.',connected:true,account:'Platform key configured',platform:true,permissions:[['Domain lookup','Fetch public domain traffic estimates.'],['Audience signals','Country and device split when available.']]},
      {key:'semrush13',family:'semrush',category:'intelligence',initials:'S13',label:'Semrush13',description:'Domain overview, keyword, backlink, and authority metrics.',connected:true,account:'Platform key configured',platform:true,permissions:[['Domain overview','Traffic, authority, and public domain metrics.'],['Keywords','SEO visibility and keyword estimates.'],['Backlink summary','Backlinks and referring domains.']]},
      {key:'semrush8',family:'semrush',category:'intelligence',initials:'S8',label:'Semrush8',description:'SEO rank, keyword, backlink, and URL traffic analysis.',connected:false,account:'Platform key configured',platform:true,permissions:[['URL lookup','Fetch URL-level SEO estimates.'],['Keyword count','Keyword and cost estimates.']]},
      {key:'domain_metrics_check',family:'domain',category:'intelligence',initials:'DM',label:'Domain Metrics Check',description:'DA/PA, Spam Score, Trust Flow, DR, and authority signals.',connected:true,account:'Platform key configured',platform:true,permissions:[['Moz-style metrics','DA, PA, and spam score.'],['Majestic-style metrics','Trust Flow and Citation Flow.']]}
    ];
    const grid=document.getElementById('grid'),search=document.getElementById('search'),drawer=document.getElementById('drawer'),scrim=document.getElementById('scrim'),body=document.getElementById('drawerBody'),title=document.getElementById('drawerTitle'),subtitle=document.getElementById('drawerSubtitle'),secondary=document.getElementById('secondary'),primary=document.getElementById('primary'),toast=document.getElementById('toast'),toastText=document.getElementById('toastText');
    let query='',category='all',active=null,mode='connect',phase='idle',authStep=0,disconnectTarget='';
    const notify=(text)=>{toastText.textContent=text;toast.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>toast.classList.remove('show'),2000)};
    const connectorCategory=(item)=>item.category==='social'?'social':item.category==='intelligence'?'intelligence':'communication';
    const visible=(item)=>(category==='all'||connectorCategory(item)===category)&&(!query||`${item.label} ${item.description}`.toLowerCase().includes(query));
    function renderGrid(){document.getElementById('connectedCount').textContent=connectors.filter(x=>x.connected).length;grid.innerHTML=connectors.filter(visible).map(item=>`<article class="card ${item.family} ${item.connected?'connected':''}"><span class="logo">${item.initials}</span><span class="copy"><strong>${item.label}</strong><span>${item.description}</span><small>${item.connected?'Connected':'Not connected'} · ${item.account}</small></span><button class="action" data-key="${item.key}">${item.connected?'✓':'+'}</button></article>`).join('');grid.querySelectorAll('.action').forEach(btn=>btn.addEventListener('click',()=>openDrawer(btn.dataset.key)))}
    function accountLabel(item){if(item.connected&&Array.isArray(item.accounts)&&item.accounts.length>1)return `${item.accounts.length} accounts`;return item.account}
    function openDrawer(key,nextMode){active=connectors.find(x=>x.key===key);mode=nextMode||(active.connected?'manage':'connect');phase='idle';authStep=0;disconnectTarget='';drawer.classList.add('show');scrim.classList.add('show');renderDrawer()}
    function closeDrawer(){drawer.classList.remove('show');scrim.classList.remove('show')}
    function renderDrawer(){title.textContent=mode==='disconnect'?`Disconnect ${active.label}`:mode==='manage'?`Manage ${active.label}`:`Connect ${active.label}`;subtitle.textContent=mode==='disconnect'?'Remove this connector from the workspace.':mode==='manage'?'Connected now. Manage or disconnect it here.':'Authorize without leaving the Connectors page.';primary.className=mode==='disconnect'?'danger-button':'primary-button';body.innerHTML=bodyHtml();secondary.textContent=phase==='done'?'Close':mode==='manage'?'Close':'Cancel';primary.textContent=primaryText();secondary.onclick=phase==='done'||mode==='manage'?closeDrawer:()=>{mode==='disconnect'?openDrawer(active.key,'manage'):closeDrawer()};primary.onclick=primaryAction;bindInlineActions()}
    function primaryText(){if(phase==='done')return 'Done';if(mode==='disconnect')return 'Disconnect';if(mode==='manage')return 'Done';if(active.platform)return 'Enable';if(active.manual)return 'Save';return 'Open authorization'}
    function bodyHtml(){if(phase==='waiting')return `<div class="waiting"><div><div class="spinner"></div><strong>Waiting for authorization...</strong><p>Finish the provider step in the opened window. This mock will return automatically.</p></div></div>`;if(phase==='done')return `<div class="success"><strong>${active.label} ${mode==='disconnect'?'disconnected':'connected'}</strong><span>${mode==='disconnect'?'The homepage card now shows +.':'The connector is ready for future discussions.'}</span></div>`;if(mode==='manage')return manageHtml();if(mode==='disconnect')return disconnectHtml();return connectHtml()}
    function connectHtml(){return `${active.featurePackages?`<div class="block"><h3>Choose access</h3><p>Defaults are selected; users only adjust if they know they need more.</p><div class="package-grid"><button class="package active"><strong>Messages</strong><span>IM history</span></button><button class="package active"><strong>Docs</strong><span>Docs and wiki</span></button><button class="package active"><strong>Calendar</strong><span>Events</span></button><button class="package"><strong>Meetings</strong><span>Optional</span></button></div></div>`:''}${active.multiStepAuth?larkAuthHtml():`<div class="block note"><h3>${active.platform?'Enable data source':active.manual?'Save source settings':'Authorize account'}</h3><p>${active.platform?'This uses the workspace platform key. No OAuth step is needed.':active.manual?'Save source settings here. Do not jump to the legacy page.':'Click once to open the provider authorization window. After callback, return to this drawer.'}</p></div>`}<div class="block"><h3>Agent access</h3>${active.permissions.slice(0,3).map(p=>`<div class="permission"><strong>${p[0]}</strong><span>${p[1]}</span></div>`).join('')}</div>`}
    function larkAuthHtml(){const steps=[['Create / open app setup','Open Lark setup link, confirm app settings.'],['Authorize your account','Open user authorization link and approve access.'],['Return to Astromar','Callback completes and this drawer closes.']];return `<div class="block note"><h3>Lark requires two external steps</h3><p>Show only the current link as the primary action. Completed steps collapse into green checks.</p></div><div class="auth-steps">${steps.map((item,index)=>`<div class="auth-step ${index<authStep?'done':index===authStep?'current':''}"><i>${index<authStep?'✓':index+1}</i><span><strong>${item[0]}</strong><span>${item[1]}</span></span>${index===authStep&&index<2?`<button class="quiet-button auth-link" data-step="${index}">${index===0?'Open setup':'Open auth'}</button>`:''}</div>`).join('')}</div>`}
    function manageHtml(){const accounts=Array.isArray(active.accounts)?active.accounts:[];return `<div class="success"><strong>${active.label} is connected</strong><span>${accountLabel(active)}</span></div>${accounts.length?`<div class="block"><h3>${accounts.length>1?'Accounts':'Account'}</h3><div class="account-list">${accounts.map(account=>`<div class="account-row"><span><strong>${account}</strong><span>${account===active.defaultAccount?'<span class="default-tag">Default</span>':'Connected'}</span></span><span class="mini-actions">${account!==active.defaultAccount&&accounts.length>1?`<button class="quiet-button make-default" data-account="${account}">Make default</button>`:''}<button class="danger-button disconnect-account" data-account="${account}">Disconnect</button></span></div>`).join('')}</div></div>`:''}<div class="block"><h3>Manage</h3><p>Keep common actions one click away.</p><div class="inline-actions">${active.platform?'':`<button class="quiet-button" id="addAnother">Add another account</button>`}${accounts.length>1?'<button class="danger-button" id="disconnectAll">Disconnect all</button>':'<button class="danger-button" id="disconnect">Disconnect</button>'}</div></div>`}
    function disconnectHtml(){const target=disconnectTarget||active.label;return `<div class="block danger"><h3>Disconnect ${target}?</h3><p>${disconnectTarget?'This removes only this account.':'This removes this connector from future discussions.'} You can reconnect later.</p></div>`}
    function bindInlineActions(){body.querySelectorAll('.package').forEach(button=>button.addEventListener('click',()=>button.classList.toggle('active')));body.querySelectorAll('.auth-link').forEach(button=>button.addEventListener('click',()=>{const clickedStep=Number(button.dataset.step);authStep=Math.max(authStep,clickedStep+1);notify(button.textContent+' opened');if(clickedStep===1){phase='waiting';renderDrawer();setTimeout(()=>finishConnect(),900);return}renderDrawer()}));body.querySelectorAll('.make-default').forEach(button=>button.addEventListener('click',()=>{active.defaultAccount=button.dataset.account;notify(`${button.dataset.account} set as default`);renderDrawer()}));body.querySelectorAll('.disconnect-account').forEach(button=>button.addEventListener('click',()=>{disconnectTarget=button.dataset.account;mode='disconnect';phase='idle';renderDrawer()}));const add=document.getElementById('addAnother');if(add)add.addEventListener('click',()=>{mode='connect';phase='idle';renderDrawer()});const disconnect=document.getElementById('disconnect');if(disconnect)disconnect.addEventListener('click',()=>{disconnectTarget='';mode='disconnect';phase='idle';renderDrawer()});const disconnectAll=document.getElementById('disconnectAll');if(disconnectAll)disconnectAll.addEventListener('click',()=>{disconnectTarget='';mode='disconnect';phase='idle';renderDrawer()})}
    function primaryAction(){if(phase==='done'){closeDrawer();return}if(mode==='manage'){closeDrawer();return}if(mode==='disconnect'){finishDisconnect();return}if(active.multiStepAuth&&authStep<2){authStep+=1;notify(authStep===1?'Setup link opened':'Authorization link opened');renderDrawer();return}if(active.oauth){phase='waiting';renderDrawer();setTimeout(()=>finishConnect(),900);return}finishConnect()}
    function finishDisconnect(){if(disconnectTarget&&Array.isArray(active.accounts)){active.accounts=active.accounts.filter(account=>account!==disconnectTarget);if(active.defaultAccount===disconnectTarget)active.defaultAccount=active.accounts[0]||'';active.connected=active.accounts.length>0;active.account=active.connected?accountLabel(active):'Not connected'}else{active.connected=false;active.accounts=[];active.defaultAccount='';active.account=active.platform?'Platform key configured':'Not connected'}phase='done';renderGrid();renderDrawer();notify(`${disconnectTarget||active.label} disconnected`)}
    function finishConnect(){active.connected=true;if(Array.isArray(active.accounts)){const next=active.multiStepAuth?'lark.user@company.com':'new.account@example.com';if(!active.accounts.includes(next))active.accounts.push(next);if(!active.defaultAccount)active.defaultAccount=next;active.account=accountLabel(active)}else{active.account=active.platform?'Platform key configured':active.manual?'Configured source':'new.account@example.com'}phase='done';renderGrid();renderDrawer();notify(`${active.label} connected`)}
    document.getElementById('close').addEventListener('click',closeDrawer);scrim.addEventListener('click',closeDrawer);search.addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();renderGrid()});document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{category=tab.dataset.category;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===tab));renderGrid()}));document.getElementById('refresh').addEventListener('click',()=>notify('Connectors refreshed'));renderGrid();
  </script>
</body>
</html>
